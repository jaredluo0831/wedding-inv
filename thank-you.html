<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>感謝您的回覆 | 羅孝祥 ♥ 郭瑞欣 婚禮邀請</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;600;700;900&family=Ma+Shan+Zheng&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#3d3226;
    --ivory:#f8f2e6;
    --paper:#fbf7ee;
    --champagne:#b3925f;
    --champagne-deep:#6b5636;
    --champagne-light:#e3d0a5;
    --gold:#c7a877;
    --gold-light:#ecdfc0;
    --gold-dark:#9c7d4c;
    --line:rgba(179,146,95,0.35);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--ivory);
    color:var(--ink);
    font-family:'Noto Serif TC',serif;
    line-height:1.8;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .brush{font-family:'Ma Shan Zheng',cursive;}
  .eng{font-family:'Cormorant Garamond',serif;}
  .wrap{
    max-width:480px;
    width:100%;
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:3px;
    padding:40px 28px 44px;
    text-align:center;
    position:relative;
    box-shadow:0 10px 40px rgba(107,86,54,0.12);
  }
  .wrap::before,.wrap::after{
    content:"";
    position:absolute;
    width:20px;height:20px;
    border:1.5px solid var(--gold);
  }
  .wrap::before{top:10px;left:10px;border-right:none;border-bottom:none;}
  .wrap::after{bottom:10px;right:10px;border-left:none;border-top:none;}

  .kicker{
    font-family:'Cormorant Garamond',serif;
    letter-spacing:.35em;
    font-size:12px;
    color:var(--gold-dark);
    text-transform:uppercase;
    margin:0 0 18px;
  }

  .photo-frame{
    width:220px;
    margin:0 auto 26px;
    padding:8px;
    background:linear-gradient(160deg,var(--gold-light),var(--gold) 55%,var(--gold-dark));
    border-radius:3px;
  }
  .photo-frame-inner{
    width:100%;
    aspect-ratio:1/1;
    overflow:hidden;
    background:var(--champagne-deep);
    border:2px solid var(--champagne-deep);
    border-radius:1px;
  }
  .photo-frame-inner img{width:100%;height:100%;object-fit:cover;display:block;}

  h1{
    font-size:24px;
    letter-spacing:.06em;
    margin:0 0 10px;
    color:var(--champagne-deep);
  }
  .sub{
    font-size:15px;
    color:#5b5040;
    margin:0 0 28px;
  }
  .divider{
    width:56px;
    height:1px;
    margin:0 auto 24px;
    background:var(--line);
  }
  .back-link{
    display:inline-block;
    margin-top:6px;
    font-size:13.5px;
    color:var(--champagne);
    border-bottom:1px solid var(--champagne);
    text-decoration:none;
  }
  footer{
    margin-top:28px;
    font-family:'Cormorant Garamond',serif;
    font-style:italic;
    color:#8a7d63;
    font-size:13px;
  }
  footer .brush{
    display:block;
    font-size:18px;
    color:var(--champagne);
    font-style:normal;
    margin-bottom:4px;
  }
</style>
</head>
